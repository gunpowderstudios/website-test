name: Activate TEST repo-path image editor v5
on:
  push:
    paths:
      - .github/workflows/activate-image-path-editor-v5.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate helper and bump cache version
        run: |
          node --check staging-image-helper.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('staging-editor.js')
          s=p.read_text()
          s=s.replace('staging-image-helper.js?v=4','staging-image-helper.js?v=5')
          p.write_text(s)
          PY
      - name: Commit safely
        run: |
          git rm .github/workflows/activate-image-path-editor-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging-editor.js staging-image-helper.js
          git commit -m "TEST editor - select existing repo image by path"
          git pull --rebase origin main
          git push
