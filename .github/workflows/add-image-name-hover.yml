name: Wire TEST image filename helper
on:
  push:
    paths:
      - .github/workflows/add-image-name-hover.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire helper into staging editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('staging-editor.js')
          s=p.read_text()
          marker='staging-image-helper.js'
          if marker not in s:
              s += "\n(function(){const current=document.currentScript;if(!current)return;const helper=document.createElement('script');helper.src=new URL('staging-image-helper.js',current.src).href;document.head.appendChild(helper);})();\n"
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git rm .github/workflows/add-image-name-hover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging-editor.js
          git commit -m "TEST editor - show image filenames on hover"
          git push