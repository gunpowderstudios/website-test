name: Add TEST Kastles page links
on:
  push:
    paths:
      - '.github/workflows/add-kastles-page-links.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Kastles links and legacy redirect
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='href="https://www.gunpowderstudios.co.uk/kastles/"'
          if old in s:
              s=s.replace(old,'href="kastles-card-game/"')
          p.write_text(s)
          Path('kastles').mkdir(exist_ok=True)
          Path('kastles/index.html').write_text('''<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<meta name="robots" content="noindex, nofollow">\n<meta http-equiv="refresh" content="0; url=../kastles-card-game/">\n<title>Kastles Card Game</title>\n<script>location.replace('../kastles-card-game/');</script>\n</head>\n<body><p>Moving to <a href="../kastles-card-game/">Kastles Card Game</a>…</p></body>\n</html>\n''')
          PY
          rm -f .github/workflows/add-kastles-page-links.yml
      - name: Commit safely
        shell: bash
        run: |
          git config user.name "Gunpowder Studios"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Kastles card game page and clean links"
          git push