name: Apply v2.9 staging links
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2-9-links.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update staging links and version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('content="v2.8"', 'content="v2.9"')
          s = s.replace('content:"v2.8"', 'content:"v2.9"')
          s = s.replace('Independent UK board game makers · Original games for families, adventurers & solo players', 'STAGING · Independent UK board game makers · Original games for families, adventurers & solo players')
          s = s.replace('href="https://www.gunpowderstudios.co.uk/bag-of-dungeon-2/"', 'href="bag-of-dungeon-2/"')
          s = s.replace('href="https://www.gunpowderstudios.co.uk/product/bag-of-dungeon-legends-pack/"', 'href="product/bag-of-dungeon-legends-pack/"')
          p.write_text(s)

          p = Path('bag-of-dungeon/index.html')
          s = p.read_text()
          s = s.replace('content="v2.7"', 'content="v2.9"')
          s = s.replace('content:"v2.7"', 'content:"v2.9"')
          s = s.replace('Bag of Dungeon landing page experiment · noindex during development', 'STAGING · Bag of Dungeon landing page · noindex during development')
          s = s.replace('href="https://www.gunpowderstudios.co.uk/bag-of-dungeon-2/"', 'href="../bag-of-dungeon-2/"')
          s = s.replace('href="https://www.gunpowderstudios.co.uk/product/bag-of-dungeon-legends-pack/"', 'href="../product/bag-of-dungeon-legends-pack/"')
          p.write_text(s)
          PY
          rm .github/workflows/apply-v2-9-links.yml
      - name: Commit v2.9 staging links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v2.9 - connect new BOD2 and Legends staging pages"
          git push