name: Apply v3.1 BOD image placeholders

on:
  push:
    paths:
      - '.github/workflows/apply-v3-1-bod-placeholders.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Bag of Dungeon page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bag-of-dungeon/index.html')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected block: {label}')
              s = s.replace(old, new, 1)

          replace_once('<meta name="build-version" content="v2.9">', '<meta name="build-version" content="v3.1">', 'build version')
          replace_once('.devbar:after{content:"v2.9";', '.devbar:after{content:"v3.1";', 'visible version')

          css_anchor = '.image-slot small{display:block;margin-top:.45rem;color:#84786a}\n'
          css_extra = '''.image-slot small{display:block;margin-top:.45rem;color:#84786a;overflow-wrap:anywhere}\n.showcase{background:#efe4d0}.showcase .section-head p{color:#665c4d}.showcase-grid{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:300px;gap:1rem}.showcase-item{min-width:0;border-radius:20px;overflow:hidden;position:relative;background:#211a14;border:1px solid rgba(23,21,17,.12);box-shadow:0 14px 34px rgba(56,37,14,.08)}.showcase-item:nth-child(1),.showcase-item:nth-child(4){grid-column:span 7}.showcase-item:nth-child(2),.showcase-item:nth-child(3){grid-column:span 5}.showcase-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}.showcase-item>div{position:relative;z-index:1}.showcase-item.image-slot{min-height:0}\n'''
          replace_once(css_anchor, css_extra, 'gallery css')

          old_900 = '@media(max-width:900px){.hero-grid,.intro,.callout-grid{grid-template-columns:1fr;gap:2.5rem}.hero-grid{padding:40px 0 80px}.hero-image{max-width:650px}.facts{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.gallery{grid-template-columns:1fr 1fr}.gallery-item:first-child{grid-column:span 2}.cards{grid-template-columns:1fr}.buy-strip{flex-direction:column;align-items:flex-start}}'
          new_900 = '@media(max-width:900px){.hero-grid,.intro,.callout-grid{grid-template-columns:1fr;gap:2.5rem}.hero-grid{padding:40px 0 80px}.hero-image{max-width:650px}.facts{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.gallery{grid-template-columns:1fr 1fr}.gallery-item:first-child{grid-column:span 2}.showcase-grid{grid-auto-rows:260px}.showcase-item:nth-child(n){grid-column:span 6}.cards{grid-template-columns:1fr}.buy-strip{flex-direction:column;align-items:flex-start}}'
          replace_once(old_900, new_900, 'tablet media query')

          old_720 = '@media(max-width:720px){.devbar{font-size:.7rem;text-align:left;padding-left:18px}.menu{display:block}.links{display:none;position:absolute;left:18px;right:18px;top:72px;flex-direction:column;align-items:stretch;background:#f8f1e4;padding:1rem;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.links.open{display:flex}.links a{padding:.55rem .7rem}.shop{text-align:center}.brand span{font-size:.84rem}.hero-grid{padding:40px 0 78px}h1{font-size:clamp(3.2rem,16vw,5.4rem)}section{padding:4rem 0}.video-section{padding:40px 0 0}.intro-section{padding:40px 0 4rem}.video-controls{right:10px;bottom:10px}.video-control{width:42px;height:42px}.facts,.steps,.gallery{grid-template-columns:1fr}.gallery-item:first-child{grid-column:auto}.section-head{display:block}.section-head p{margin-top:1rem}.photo img{min-height:300px}.foot{display:block}.foot div+div{margin-top:1rem}}'
          new_720 = '@media(max-width:720px){.devbar{font-size:.7rem;text-align:left;padding-left:18px}.menu{display:block}.links{display:none;position:absolute;left:18px;right:18px;top:72px;flex-direction:column;align-items:stretch;background:#f8f1e4;padding:1rem;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.links.open{display:flex}.links a{padding:.55rem .7rem}.shop{text-align:center}.brand span{font-size:.84rem}.hero-grid{padding:40px 0 78px}h1{font-size:clamp(3.2rem,16vw,5.4rem)}section{padding:4rem 0}.video-section{padding:40px 0 0}.intro-section{padding:40px 0 4rem}.video-controls{right:10px;bottom:10px}.video-control{width:42px;height:42px}.facts,.steps,.gallery{grid-template-columns:1fr}.gallery-item:first-child{grid-column:auto}.gallery-item{min-height:260px}.gallery-item img{min-height:260px}.showcase-grid{grid-template-columns:1fr;grid-auto-rows:auto}.showcase-item:nth-child(n){grid-column:auto;aspect-ratio:4/3}.section-head{display:block}.section-head p{margin-top:1rem}.photo img{min-height:300px}.foot{display:block}.foot div+div{margin-top:1rem}}'
          replace_once(old_720, new_720, 'mobile media query')

          html_anchor = '''</section>\n<section class="callout">'''
          html_extra = '''</section>\n<section class="showcase" aria-label="More Bag of Dungeon images">\n  <div class="wrap">\n    <div class="section-head"><h2>Inside the bag</h2><p>Heroes, monsters, loot and one very angry dragon. Add these images when you are ready and the placeholders will disappear automatically.</p></div>\n    <div class="showcase-grid">\n      <div class="showcase-item image-slot"><img src="../images/bag-of-dungeon-heroes.jpg" onerror="this.style.display='none'" alt="Bag of Dungeon heroes and character miniatures"><div><strong>Heroes</strong><small>bag-of-dungeon-heroes.jpg</small></div></div>\n      <div class="showcase-item image-slot"><img src="../images/bag-of-dungeon-monsters.jpg" onerror="this.style.display='none'" alt="Bag of Dungeon monsters"><div><strong>Monsters</strong><small>bag-of-dungeon-monsters.jpg</small></div></div>\n      <div class="showcase-item image-slot"><img src="../images/bag-of-dungeon-items.jpg" onerror="this.style.display='none'" alt="Bag of Dungeon items, weapons and treasure"><div><strong>Items & loot</strong><small>bag-of-dungeon-items.jpg</small></div></div>\n      <div class="showcase-item image-slot"><img src="../images/bag-of-dungeon-dragon.jpg" onerror="this.style.display='none'" alt="Bag of Dungeon Red Dragon"><div><strong>The Red Dragon</strong><small>bag-of-dungeon-dragon.jpg</small></div></div>\n    </div>\n  </div>\n</section>\n<section class="callout">'''
          replace_once(html_anchor, html_extra, 'showcase insertion')

          path.write_text(s)
          PY

          rm .github/workflows/apply-v3-1-bod-placeholders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v3.1 - add mobile-friendly BOD image placeholders"
          git push
