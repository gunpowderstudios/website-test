name: Apply v3.3 staging text editor
on:
  push:
    paths:
      - '.github/workflows/apply-v3-3-staging-editor.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire staging editor into TEST pages
        shell: python
        run: |
          from pathlib import Path

          pages = {
              Path('index.html'): ('v3.0', 'staging-editor.js'),
              Path('bag-of-dungeon/index.html'): ('v3.2', '../staging-editor.js'),
              Path('bag-of-dungeon-2/index.html'): ('v2.9', '../staging-editor.js'),
              Path('product/bag-of-dungeon-legends-pack/index.html'): ('v2.9', '../../staging-editor.js'),
          }

          for path, (old_version, editor_src) in pages.items():
              text = path.read_text()
              text = text.replace(f'content="{old_version}"', 'content="v3.3"')
              text = text.replace(f'content:"{old_version}"', 'content:"v3.3"')
              script = f'<script src="{editor_src}"></script>'
              if script not in text:
                  text = text.replace('</body>', script + '\n</body>')
              path.write_text(text)
      - name: Commit v3.3 editor wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html bag-of-dungeon/index.html bag-of-dungeon-2/index.html product/bag-of-dungeon-legends-pack/index.html
          git diff --cached --quiet || git commit -m "v3.3 - add staging-only text editor"
          git push
