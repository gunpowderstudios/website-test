name: Apply v3.4 game card images
on:
  push:
    paths:
      - '.github/workflows/apply-v3-4-game-card-images.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage game cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<meta name="build-version" content="v3.3">','<meta name="build-version" content="v3.4">',1)
          s=s.replace('.topbar:after{content:"v3.3";','.topbar:after{content:"v3.4";',1)

          old_css='''.games{background:#161410;color:#f8efd9}.games .section-head p{color:#bdb19e}.games-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.game-card{min-height:270px;padding:1.55rem;border-radius:16px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(145deg,#25211b,#12110f);display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;transition:.2s ease}.game-card:hover{transform:translateY(-4px);border-color:rgba(217,156,56,.48)}.game-icon{font-size:2.6rem}.game-card h3{font-size:1.75rem;margin-top:1.6rem}.game-card p{font-size:.91rem;color:#bdb19e;margin:.65rem 0 0}.game-card span{font-size:.82rem;color:#efbd66;font-weight:800;margin-top:1.35rem}'''
          new_css='''.games{background:#161410;color:#f8efd9}.games .section-head p{color:#bdb19e}.games-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.game-card{min-height:340px;padding:1.55rem;border-radius:16px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(145deg,#25211b,#12110f);display:flex;flex-direction:column;text-decoration:none;overflow:hidden;transition:.2s ease}.game-card:hover{transform:translateY(-4px);border-color:rgba(217,156,56,.48)}.game-media{height:145px;flex:0 0 145px;margin:-1.55rem -1.55rem 1.35rem;position:relative;overflow:hidden;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#302b24,#171511);border-bottom:1px solid rgba(255,255,255,.08)}.game-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}.game-media-label{position:relative;z-index:1;padding:1rem;color:#918675;font-size:.72rem;line-height:1.4}.game-media-label strong{display:block;color:#d7c4a4;text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;margin-bottom:.35rem}.game-card-body{display:flex;flex:1;flex-direction:column}.game-card h3{font-size:1.75rem;margin:0}.game-card p{font-size:.91rem;color:#bdb19e;margin:.65rem 0 0}.game-card span{font-size:.82rem;color:#efbd66;font-weight:800;margin-top:auto;padding-top:1.35rem}'''
          if old_css not in s:
              raise SystemExit('Expected games CSS not found')
          s=s.replace(old_css,new_css,1)

          old_section='''<section class="games"><div class="wrap"><div class="section-head"><h2>More games from Gunpowder</h2><p>Fantasy worlds, castle-smashing card games and family favourites — all with simple rules and plenty of character.</p></div><div class="games-grid"><a class="game-card" href="https://www.gunpowderstudios.co.uk/7-moons/"><div class="game-icon">🌙</div><div><h3>7 Moons</h3><p>Quest, trade and defend your realm in a magical open-world adventure.</p><span>Explore 7 Moons →</span></div></a><a class="game-card" href="https://www.gunpowderstudios.co.uk/kastles/"><div class="game-icon">🏰</div><div><h3>Kastles</h3><p>Build your castle, load the catapults and never trust your neighbours.</p><span>Storm the Kastles →</span></div></a><a class="game-card" href="https://www.gunpowderstudios.co.uk/rabbito/"><div class="game-icon">🐇</div><div><h3>Rabbito</h3><p>A strategic family game of carrot collecting for very pushy rabbits.</p><span>Meet Rabbito →</span></div></a><a class="game-card" href="https://www.gunpowderstudios.co.uk/cheese/"><div class="game-icon">🧀</div><div><h3>Who Stole My Cheese?</h3><p>Bluff, accuse and work out who you can trust before the cheese disappears.</p><span>Find the cheese →</span></div></a></div></div></section>'''
          new_section='''<section class="games"><div class="wrap"><div class="section-head"><h2>More games from Gunpowder</h2><p>Fantasy worlds, castle-smashing card games and family favourites — all with simple rules and plenty of character.</p></div><div class="games-grid">
<a class="game-card" href="https://www.gunpowderstudios.co.uk/7-moons/"><div class="game-media"><img src="images/7-moons-main.jpg" data-png="images/7-moons-main.png" onerror="if(!this.dataset.triedPng){this.dataset.triedPng='1';this.src=this.dataset.png}else{this.style.display='none'}" alt="7 Moons"><div class="game-media-label"><strong>Image needed</strong>7-moons-main.jpg or 7-moons-main.png</div></div><div class="game-card-body"><h3>7 Moons</h3><p>Quest, trade and defend your realm in a magical open-world adventure.</p><span>Explore 7 Moons →</span></div></a>
<a class="game-card" href="https://www.gunpowderstudios.co.uk/kastles/"><div class="game-media"><img src="images/kastles-main.jpg" data-png="images/kastles-main.png" onerror="if(!this.dataset.triedPng){this.dataset.triedPng='1';this.src=this.dataset.png}else{this.style.display='none'}" alt="Kastles"><div class="game-media-label"><strong>Image needed</strong>kastles-main.jpg or kastles-main.png</div></div><div class="game-card-body"><h3>Kastles</h3><p>Build your castle, load the catapults and never trust your neighbours.</p><span>Storm the Kastles →</span></div></a>
<a class="game-card" href="https://www.gunpowderstudios.co.uk/rabbito/"><div class="game-media"><img src="images/rabbito-main.jpg" data-png="images/rabbito-main.png" onerror="if(!this.dataset.triedPng){this.dataset.triedPng='1';this.src=this.dataset.png}else{this.style.display='none'}" alt="Rabbito"><div class="game-media-label"><strong>Image needed</strong>rabbito-main.jpg or rabbito-main.png</div></div><div class="game-card-body"><h3>Rabbito</h3><p>A strategic family game of carrot collecting for very pushy rabbits.</p><span>Meet Rabbito →</span></div></a>
<a class="game-card" href="https://www.gunpowderstudios.co.uk/cheese/"><div class="game-media"><img src="images/cheese-main.jpg" data-png="images/cheese-main.png" onerror="if(!this.dataset.triedPng){this.dataset.triedPng='1';this.src=this.dataset.png}else{this.style.display='none'}" alt="Who Stole My Cheese?"><div class="game-media-label"><strong>Image needed</strong>cheese-main.jpg or cheese-main.png</div></div><div class="game-card-body"><h3>Who Stole My Cheese?</h3><p>Bluff, accuse and work out who you can trust before the cheese disappears.</p><span>Find the cheese →</span></div></a>
</div></div></section>'''
          if old_section not in s:
              raise SystemExit('Expected More games section not found')
          s=s.replace(old_section,new_section,1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/apply-v3-4-game-card-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v3.4 - add image-ready More games cards"
          git push