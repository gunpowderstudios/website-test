name: Apply v3.4 game card images
'on':
  push:
    paths:
      - '.github/workflows/apply-v3-4-game-card-images.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage
        run: python3 .github/scripts/apply_v34.py
      - name: Commit changes
        run: |
          git rm .github/workflows/apply-v3-4-game-card-images.yml .github/scripts/apply_v34.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v3.4 - add image-ready More games cards"
          git push