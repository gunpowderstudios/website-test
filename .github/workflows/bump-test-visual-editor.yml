name: Bump TEST visual editor cache
on:
  push:
    paths:
      - '.github/workflows/bump-test-visual-editor.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump editor script version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.html'):
              s=p.read_text()
              n=re.sub(r'staging-editor\.js\?v=[^"\']+', 'staging-editor.js?v=3.7.0', s)
              if n != s:
                  p.write_text(n)
          PY
          rm -f .github/workflows/bump-test-visual-editor.yml
      - name: Commit safely
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Bump TEST visual editor cache"
          git pull --rebase origin main
          for i in 1 2 3; do
            git push origin main && exit 0
            sleep 2
            git pull --rebase origin main
          done
          exit 1
