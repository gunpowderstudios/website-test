name: Clean TEST hero images
on:
  push:
    paths:
      - '.github/workflows/clean-hero-images.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hero glass boxes and prevent cropping
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
              'bag-of-dungeon-2/index.html': {
                  'old_css': '.hero-visual{min-height:440px;border-radius:26px;overflow:hidden;position:relative;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(0,0,0,.12));border:1px solid rgba(255,255,255,.11)}.hero-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:1rem;z-index:2;filter:drop-shadow(0 28px 45px rgba(0,0,0,.4))}',
                  'new_css': '.hero-visual{min-height:440px;position:relative;display:grid;place-items:center;background:transparent;border:0;border-radius:0;overflow:visible}.hero-visual img{position:relative;inset:auto;width:100%;height:auto;max-height:520px;object-fit:contain;padding:0;z-index:2;filter:drop-shadow(0 28px 45px rgba(0,0,0,.4))}',
                  'old_img': '<img src="../images/bag-of-dungeon-2-hero.png" onerror="this.style.display=\'none\'" alt="Bag of Dungeon 2: The Cursed Forest">',
                  'new_img': '<img src="../images/bag-of-dungeon-2-hero.png" onerror="if(!this.dataset.fallback){this.dataset.fallback=\'1\';this.src=\'../images/bag-of-dungeon-2-main.jpg\';}else{this.style.display=\'none\';}" alt="Bag of Dungeon 2: The Cursed Forest">',
              },
              'bag-of-dungeon-legends/index.html': {
                  'old_css': '.hero-visual{min-height:440px;border-radius:26px;overflow:hidden;position:relative;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(0,0,0,.14));border:1px solid rgba(255,255,255,.11)}.hero-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:1rem;z-index:2;filter:drop-shadow(0 28px 45px rgba(0,0,0,.4))}',
                  'new_css': '.hero-visual{min-height:440px;position:relative;display:grid;place-items:center;background:transparent;border:0;border-radius:0;overflow:visible}.hero-visual img{position:relative;inset:auto;width:100%;height:auto;max-height:520px;object-fit:contain;padding:0;z-index:2;filter:drop-shadow(0 28px 45px rgba(0,0,0,.4))}',
                  'old_img': '<img src="../images/legends-hero.png" onerror="this.style.display=\'none\'" alt="Bag of Dungeon Legends and Legends 2: Relics">',
                  'new_img': '<img src="../images/legends-hero.png" onerror="if(!this.dataset.fallback){this.dataset.fallback=\'1\';this.src=\'../images/legends-main.jpg\';}else{this.style.display=\'none\';}" alt="Bag of Dungeon Legends and Legends 2: Relics">',
              },
              'kastles-card-game/index.html': {
                  'old_css': '.hero-visual{min-height:470px;border-radius:26px;overflow:hidden;position:relative;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(0,0,0,.16));border:1px solid rgba(255,255,255,.11);box-shadow:0 26px 70px rgba(0,0,0,.28)}.hero-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}',
                  'new_css': '.hero-visual{min-height:470px;position:relative;display:grid;place-items:center;background:transparent;border:0;border-radius:0;overflow:visible;box-shadow:none}.hero-visual img{position:relative;inset:auto;width:100%;height:auto;max-height:540px;object-fit:contain;z-index:2;filter:drop-shadow(0 28px 45px rgba(0,0,0,.4))}',
                  'old_img': '<img src="../images/kastles-box.png" alt="Kastles card game">',
                  'new_img': '<img src="../images/kastles-box.png" onerror="if(!this.dataset.fallback){this.dataset.fallback=\'1\';this.src=\'../images/kastles-main.jpg\';}else{this.style.display=\'none\';}" alt="Kastles card game">',
              },
          }

          for path, repl in files.items():
              p = Path(path)
              s = p.read_text()
              if repl['old_css'] not in s:
                  raise SystemExit(f'Expected hero CSS not found in {path}')
              s = s.replace(repl['old_css'], repl['new_css'], 1)
              if repl['old_img'] not in s:
                  raise SystemExit(f'Expected hero img not found in {path}')
              s = s.replace(repl['old_img'], repl['new_img'], 1)
              p.write_text(s)
          PY
      - name: Commit safely
        run: |
          rm -f .github/workflows/clean-hero-images.yml
          git config user.name 'Gunpowder Studios'
          git config user.email '38918114+gunpowderstudios@users.noreply.github.com'
          git add -A
          git commit -m 'Clean game hero images and prevent cropping'
          git push
