name: Fix TEST ready-to-roll image
on:
  push:
    paths:
      - .github/workflows/fix-ready-to-roll-image.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show full Ready to Roll artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.cta-image{position:absolute;inset:0;z-index:-2;display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;object-position:center;filter:none}'
          new='.cta-image{position:absolute;inset:0;z-index:-2;display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;object-position:center;background:#180d09;filter:none}'
          if old not in s:
              raise SystemExit('Ready-to-roll CTA image CSS pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit safely
        run: |
          git rm .github/workflows/fix-ready-to-roll-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "TEST - show full Ready to Roll background image"
          git pull --rebase origin main
          git push origin main