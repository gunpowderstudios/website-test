name: Match TEST ready-to-roll to LIVE
on:
  push:
    paths:
      - '.github/workflows/match-ready-to-roll-live.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore LIVE Ready to Roll treatment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='object-fit:contain;object-position:center;background:#180d09;filter:none'
          new='object-fit:cover;object-position:center;filter:none'
          if old not in s:
              raise SystemExit('Expected TEST Ready-to-roll CSS not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/match-ready-to-roll-live.yml
          git add index.html
          git commit -m "TEST - match Ready to Roll panel to LIVE"
          git push
