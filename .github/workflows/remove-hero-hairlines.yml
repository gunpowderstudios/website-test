name: Remove TEST hero hairlines
on:
  push:
    paths:
      - '.github/workflows/remove-hero-hairlines.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove decorative rotated hero outlines
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': '.hero:before,.hero:after{content:"";position:absolute;width:420px;height:420px;border:1px solid rgba(217,156,56,.14);transform:rotate(45deg);border-radius:48px}.hero:before{right:-120px;top:-180px}.hero:after{right:80px;bottom:-310px;width:580px;height:580px}',
              'bag-of-dungeon/index.html': '.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(217,156,56,.13);transform:rotate(45deg);border-radius:60px}.hero:before{width:440px;height:440px;right:-130px;top:-220px}.hero:after{width:620px;height:620px;right:100px;bottom:-450px}',
              'book-of-dungeon/index.html': '.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(240,208,176,.12);transform:rotate(45deg);border-radius:54px}.hero:before{width:420px;height:420px;right:-150px;top:-210px}.hero:after{width:580px;height:580px;right:100px;bottom:-460px}',
              'kastles-card-game/index.html': '.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(248,147,23,.18);transform:rotate(45deg);border-radius:54px}.hero:before{width:420px;height:420px;right:-140px;top:-220px}.hero:after{width:580px;height:580px;right:120px;bottom:-450px}',
          }

          changed = []
          for filename, old in replacements.items():
              p = Path(filename)
              s = p.read_text()
              if old in s:
                  p.write_text(s.replace(old, '', 1))
                  changed.append(filename)
              elif 'transform:rotate(45deg)' in s and '.hero' in s:
                  raise SystemExit(f'Unexpected hero hairline pattern in {filename}; refusing partial edit')

          print('Updated:', ', '.join(changed))
          PY
          git rm .github/workflows/remove-hero-hairlines.yml
      - name: Commit safely
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add -A
          git commit -m "Remove decorative hero hairlines"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
