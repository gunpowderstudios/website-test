name: Remove TEST lightbox
on:
  push:
    paths:
      - '.github/workflows/remove-test-lightbox.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove lightbox from all TEST pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              n=re.sub(r'\n?<script[^>]*src=["\'][^"\']*lightbox\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*', '\n', s, flags=re.I)
              if n != s:
                  p.write_text(n, encoding='utf-8')
          PY
          rm -f lightbox.js
          rm -f .github/workflows/remove-test-lightbox.yml
      - name: Verify removal
        run: |
          test ! -e lightbox.js
          ! grep -RIl 'lightbox.js' --include='*.html' . >/tmp/lightbox_refs || (cat /tmp/lightbox_refs && exit 1)
      - name: Commit safely
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove image lightbox from TEST site"
          git pull --rebase origin main
          for i in 1 2 3; do
            git push origin main && exit 0
            sleep 2
            git pull --rebase origin main
          done
          exit 1
