name: Sync from live

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy live site into staging
        run: |
          git clone --depth 1 https://github.com/gunpowderstudios/website.git /tmp/live
          rsync -a --delete --exclude='.git' /tmp/live/ ./

      - name: Commit exact mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync staging from live v2.8"
          git push origin main
