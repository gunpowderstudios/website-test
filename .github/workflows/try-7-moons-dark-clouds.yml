name: Try 7 Moons dark clouds hero
on:
  push:
    paths:
      - '.github/workflows/try-7-moons-dark-clouds.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dark clouds hero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('7-moons/index.html')
          s = p.read_text()
          old = ".hero{padding:0;position:relative;overflow:hidden;color:white;background:radial-gradient(circle at 82% 16%,rgba(199,169,74,.18),transparent 17rem),radial-gradient(circle at 76% 74%,rgba(63,109,69,.30),transparent 22rem),linear-gradient(155deg,#08131a 0%,#12323b 52%,#16301f 100%)}.hero:before{content:\"\";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,12,17,.82) 0%,rgba(9,24,29,.50) 47%,rgba(12,32,24,.18) 100%);pointer-events:none}"
          new = ".hero{padding:0;position:relative;overflow:hidden;color:white;background:url(\"../images/dark-clouds.jpg\") center 44%/cover no-repeat}.hero:before{content:\"\";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,10,15,.86) 0%,rgba(7,18,24,.60) 45%,rgba(9,23,20,.30) 72%,rgba(8,18,14,.42) 100%),linear-gradient(180deg,rgba(0,0,0,.08),rgba(8,18,14,.48));pointer-events:none}"
          if old not in s:
              raise SystemExit('Expected hero CSS not found; refusing stale edit')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/try-7-moons-dark-clouds.yml
      - name: Commit safely
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add 7-moons/index.html .github/workflows/try-7-moons-dark-clouds.yml
          git commit -m "Try dark clouds background on 7 Moons hero"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
