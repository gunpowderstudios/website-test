name: Wire TEST 7 Moons page
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-7-moons-page.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage 7 Moons links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('https://www.gunpowderstudios.co.uk/7-moons/','7-moons/')
          p.write_text(s)
          PY
          rm -f .github/workflows/wire-7-moons-page.yml
      - name: Commit safely
        run: |
          git config user.name 'Gunpowder Studios'
          git config user.email '38918114+gunpowderstudios@users.noreply.github.com'
          git add -A
          git commit -m 'Wire homepage to TEST 7 Moons page' || exit 0
          git pull --rebase origin main
          for i in 1 2 3; do git push origin main && exit 0; sleep 2; git pull --rebase origin main; done
          exit 1