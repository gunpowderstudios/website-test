name: Wire TEST Book of Dungeon page
on:
  push:
    paths:
      - '.github/workflows/wire-book-of-dungeon-page.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage Book of Dungeon links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('https://www.gunpowderstudios.co.uk/book-of-dungeon/','book-of-dungeon/')
          p.write_text(s)
          PY
          rm -f .github/workflows/wire-book-of-dungeon-page.yml
      - name: Commit safely
        run: |
          git config user.name 'Gunpowder Studios'
          git config user.email '38918114+gunpowderstudios@users.noreply.github.com'
          git add index.html .github/workflows/wire-book-of-dungeon-page.yml
          git commit -m 'Link homepage to TEST Book of Dungeon page' || exit 0
          git pull --rebase origin main
          for i in 1 2 3; do git push origin main && exit 0; git pull --rebase origin main; sleep 2; done
          exit 1